services:
  keras:
    container_name: keras

    build:
      context: .
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}

    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    environment:
      PORT: ${PORT:-3000}
      HOSTNAME: 0.0.0.0

      SHLINK_BASE_URL: http://shlink:8080
      SHLINK_API_KEY: ${SHLINK_API_KEY}

    env_file:
      - .env

    restart: unless-stopped

    networks:
      - apps

  redis:
    image: redis:7-alpine
    container_name: keras_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - apps
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  apps:
    external: true

volumes:
  redis_data:
